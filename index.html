<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>Speak Calc</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Speak Calc</h1>
    <button id="mute-btn" aria-label="Unmute">🔇</button>
  </header>

  <!-- Mic -->
  <div class="mic-wrap">
    <button id="mic-btn" aria-label="Start listening">🎤</button>
    <p id="transcript"></p>
  </div>

  <!-- Result -->
  <div class="result-card" role="region" aria-live="polite" aria-label="Calculation result">
    <div id="result-primary"></div>
    <ul id="result-lines"></ul>
    <p id="error-msg" role="alert"></p>
  </div>

  <!-- Tax override -->
  <div class="tax-row">
    <label for="tax-input">Tax %</label>
    <input id="tax-input" type="number" min="0" max="30" step="0.1"
           placeholder="e.g. 8.5" inputmode="decimal">
    <span id="tax-display"></span>
  </div>

  <!-- Text fallback -->
  <div class="text-row">
    <input id="text-input" type="text"
           placeholder="Or type: tip 15% on $84 …"
           autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <!-- History -->
  <section class="history-section">
    <div class="history-header">
      <h2>Recent</h2>
      <button id="clear-btn">Clear</button>
    </div>
    <ul id="history-list">
      <li class="empty">No history yet</li>
    </ul>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
